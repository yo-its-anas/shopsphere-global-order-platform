[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsphere-analytics-service"
version = "0.1.0"
description = "Read-only executive business operations aggregation service."
requires-python = ">=3.10,<3.15"
dependencies = [
  "anyio==4.12.1",
  "fastapi==0.139.2",
  "httpx2==2.7.0",
  "prometheus-client==0.22.1",
  "PyJWT[crypto]==2.13.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "black==26.5.1",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
