apiVersion: v1
kind: Secret
metadata:
  name: shopsphere-keycloak-credentials
  namespace: shopsphere-platform
  annotations:
    shopsphere.io/template-only: "true"
type: Opaque
stringData:
  keycloak-db-password: COPY_FROM_EXISTING_POSTGRESQL_SECRET_WITHOUT_PRINTING
  bootstrap-admin-username: REPLACE_WITH_NON_DEFAULT_ADMINISTRATOR_USERNAME
  bootstrap-admin-password: REPLACE_WITH_STRONG_BOOTSTRAP_PASSWORD
