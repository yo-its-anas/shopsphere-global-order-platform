apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opentelemetry-collector
  namespace: shopsphere-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/component: telemetry-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              shopsphere.io/tier: applications
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              shopsphere.io/tier: monitoring
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 13133
  # The PoC trace sink is the Collector's own stdout. No network exporter is
  # configured, so the Collector has no required egress destination.
  egress: []
