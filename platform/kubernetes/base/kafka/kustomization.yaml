  - statefulset.yaml
  - network-policy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: event-broker
      app.kubernetes.io/part-of: shopsphere
      app.kubernetes.io/managed-by: kustomize
