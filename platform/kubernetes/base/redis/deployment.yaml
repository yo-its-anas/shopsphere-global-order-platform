apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shopsphere-data
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure-redis-acl
          image: redis:7.4.2-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              printf 'user default on >%s ~shopsphere:catalogue:* +get +set +unlink +scan +ping\n' "$REDIS_PASSWORD" > /redis-auth/users.acl
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-redis-credentials
                  key: redis-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: redis-auth
              mountPath: /redis-auth
            - name: temporary
              mountPath: /tmp
      containers:
        - name: redis
          image: redis:7.4.2-bookworm
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - /etc/redis/redis.conf
            - --aclfile
            - /redis-auth/users.acl
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-redis-credentials
                  key: redis-password
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -qx PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -qx PONG
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -qx PONG
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-configuration
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: redis-auth
              mountPath: /redis-auth
              readOnly: true
            - name: redis-data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: redis-configuration
          configMap:
            name: redis-configuration
        - name: redis-auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: redis-data
          emptyDir:
            sizeLimit: 64Mi
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
