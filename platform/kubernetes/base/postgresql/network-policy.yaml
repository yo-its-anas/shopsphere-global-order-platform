apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-ingress
  namespace: shopsphere-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              shopsphere.io/tier: applications
        - namespaceSelector:
            matchLabels:
              shopsphere.io/tier: platform
      ports:
        - protocol: TCP
          port: 5432
