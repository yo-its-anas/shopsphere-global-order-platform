apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: shopsphere-data
spec:
  serviceName: postgresql
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:16.4-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: shopsphere_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-postgresql-credentials
                  key: postgres-password
            - name: CUSTOMER_DB_NAME
              value: customer_db
            - name: CUSTOMER_DB_USER
              value: customer_app
            - name: CUSTOMER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-postgresql-credentials
                  key: customer-password
            - name: KEYCLOAK_DB_NAME
              value: keycloak_db
            - name: KEYCLOAK_DB_USER
              value: keycloak_app
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-postgresql-credentials
                  key: keycloak-password
            - name: CATALOGUE_DB_NAME
              value: catalogue_db
            - name: CATALOGUE_DB_USER
              value: catalogue_app
            - name: CATALOGUE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-postgresql-credentials
                  key: catalogue-password
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: postgresql-initialization
              mountPath: /docker-entrypoint-initdb.d/init-databases.sh
              subPath: init-databases.sh
              readOnly: true
            - name: runtime
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: postgresql-initialization
          configMap:
            name: postgresql-initialization
            defaultMode: 0550
        - name: runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 80Gi
